name: Build Windows and Linux x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: local-ocr-windows-x64
            bundles: nsis
          - name: Linux x64
            runner: ubuntu-22.04
            artifact: local-ocr-linux-x64
            bundles: appimage

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            sidecar/requirements.txt
            sidecar/requirements-build.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Restore frozen OCR sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/ocr-sidecar-*
          key: ocr-sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sidecar/**/*.py', 'sidecar/requirements*.txt', 'scripts/build-sidecar.py', 'scripts/platform_target.py') }}

      - name: Restore PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddle-models-${{ runner.os }}-pp-ocrv5-mobile-v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Install PaddleOCR sidecar dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements-build.txt

      - name: Verify PaddlePaddle runtime
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: python -c "import paddle, paddleocr; paddle.utils.run_check(); print('PaddleOCR import OK')"

      - name: Run source checks
        run: |
          npm run build
          npm run test:python

      - name: Freeze Python sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: npm run sidecar:build

      - name: Verify frozen sidecar and models
        timeout-minutes: 25
        run: npm run sidecar:smoke -- --prepare

      - name: Free pip download cache
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: python -m pip cache purge

      - name: Build Tauri packages
        timeout-minutes: 120
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
