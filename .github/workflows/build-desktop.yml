name: Build Windows and Linux x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: local-ocr-windows-x64
            bundles: nsis
          - name: Linux x64
            runner: ubuntu-22.04
            artifact: local-ocr-linux-x64
            bundles: appimage

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            sidecar/requirements.txt
            sidecar/requirements-build.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Restore frozen OCR sidecar
        id: sidecar-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/binaries/ocr-sidecar-*
          key: ocr-sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sidecar/**/*.py', 'sidecar/requirements*.txt', 'scripts/build-sidecar.py', 'scripts/platform_target.py') }}

      - name: Restore PaddleOCR models
        uses: actions/cache@v5
        with:
          path: ~/.paddlex/official_models
          key: paddle-models-${{ runner.os }}-pp-ocrv5-fast-accurate-v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Install PaddleOCR sidecar dependencies
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements-build.txt

      - name: Verify PaddlePaddle runtime
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: python -c "import paddle, paddleocr; paddle.utils.run_check(); print('PaddleOCR import OK')"

      - name: Run source checks
        run: |
          npm run build
          npm run test:python

      - name: Freeze Python sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: npm run sidecar:build

      - name: Verify frozen sidecar and models
        timeout-minutes: 45
        run: npm run sidecar:smoke -- --prepare --all-profiles

      - name: Free pip download cache
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: python -m pip cache purge

      - name: Build Tauri packages
        timeout-minutes: 120
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --ci

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-linux-webkitgtk-4:
    name: Linux x64 WebKitGTK 4.0 Experimental
    runs-on: ubuntu-22.04
    container:
      image: debian:bullseye-slim
    timeout-minutes: 240

    steps:
      - name: Prepare Debian 11 build container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            patchelf \
            unzip \
            wget \
            xdg-utils \
            xz-utils \
            zstd
          DEBIAN_FRONTEND=noninteractive apt-get install -y libayatana-appindicator3-dev

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up portable Python toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: |
            sidecar/requirements.txt
            sidecar/requirements-build.txt

      - name: Create Python 3.11 environment inside the container
        shell: bash
        run: |
          uv python install 3.11.15
          uv venv --python 3.11.15 --seed .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify container Python and glibc baseline
        run: |
          python --version
          python -m pip --version
          ldd --version | head -n 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache WebKitGTK 4.0 Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./compat/webkitgtk-4.0/src-tauri -> target"
          key: webkitgtk-4.0-debian11

      - name: Restore WebKitGTK 4.0 frozen OCR sidecar
        id: sidecar-webkit4-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/binaries/ocr-sidecar-*
          key: ocr-sidecar-webkit4-debian11-py311-${{ runner.arch }}-${{ hashFiles('sidecar/**/*.py', 'sidecar/requirements*.txt', 'scripts/build-sidecar.py', 'scripts/platform_target.py') }}

      - name: Restore PaddleOCR models
        uses: actions/cache@v5
        with:
          path: ~/.paddlex/official_models
          key: paddle-models-linux-pp-ocrv5-fast-accurate-v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Install PaddleOCR sidecar dependencies
        if: steps.sidecar-webkit4-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements-build.txt

      - name: Verify PaddlePaddle runtime
        if: steps.sidecar-webkit4-cache.outputs.cache-hit != 'true'
        run: python -c "import paddle, paddleocr; paddle.utils.run_check(); print('PaddleOCR import OK')"

      - name: Run shared and WebKitGTK 4.0 source checks
        run: |
          npm run build:webkit4
          npm run test:python

      - name: Freeze Python sidecar on Debian 11
        if: steps.sidecar-webkit4-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: npm run sidecar:build

      - name: Verify frozen sidecar and models
        timeout-minutes: 45
        run: npm run sidecar:smoke -- --prepare

      - name: Stage sidecar for Tauri 1 shell
        run: npm run sidecar:stage-webkit4

      - name: Install Tauri 1 CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@1.6.3

      - name: Free pip download cache
        if: steps.sidecar-webkit4-cache.outputs.cache-hit != 'true'
        run: python -m pip cache purge

      - name: Build WebKitGTK 4.0 AppImage
        working-directory: compat/webkitgtk-4.0
        timeout-minutes: 120
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VITE_WEBKITGTK_4_0: "1"
        run: ../../node_modules/.bin/tauri build --bundles appimage --ci

      - name: Upload WebKitGTK 4.0 AppImage
        uses: actions/upload-artifact@v6
        with:
          name: local-ocr-linux-x64-webkitgtk-4.0
          path: compat/webkitgtk-4.0/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
