[package]
name = "local-ocr"
version = "0.2.8"
description = "A privacy-first local OCR desktop application"
authors = ["Local OCR contributors"]
edition = "2021"

[lib]
name = "local_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
