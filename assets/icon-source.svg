<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">本地 OCR — 灰绿修长版</title>
  <desc id="desc">沿用 B 版的灰绿色、浅米绿色横线和扫描角，采用 C 版的修长纸张与较大右上折角。背景透明。</desc>
  <!-- C paper silhouette and fold, with B palette. -->
  <path fill="#527563" d="M236 120H600L808 328V860Q808 904 764 904H260Q216 904 216 860V140Q216 120 236 120Z"/>
  <path fill="#B6D4B5" d="M600 120L808 328H600Z"/>
  <!-- B text strokes: preserve their color, weight, spacing and lengths. -->
  <g fill="#F0F4E6">
    <rect x="304" y="436" width="416" height="36" rx="18"/>
    <rect x="304" y="552" width="416" height="36" rx="18"/>
    <rect x="304" y="668" width="320" height="36" rx="18"/>
  </g>
  <!-- B bracket styling, repositioned around the narrower paper. -->
  <g fill="none" stroke="#7CA58C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 136V56H224"/>
    <path d="M880 888V968H800"/>
  </g>
</svg>
